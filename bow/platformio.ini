; Смычок — M5Stack StickS3.
; Описание платы: ../boards/iv_bow.json, параметры сборки: sdkconfig.defaults.

[platformio]
boards_dir = ../boards
src_dir = main

[env:bow]
platform = espressif32
board = iv_bow
framework = espidf

; Без этого PlatformIO считает размер прошивки по своей таблице разделов
; и показывает лимит 1 МБ вместо реальных 4 МБ из partitions.csv.
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
