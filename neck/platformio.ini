; Гриф — Waveshare ESP32-S3-Touch-LCD-3.49 V2.
; Описание платы лежит в ../boards/iv_neck.json, параметры сборки — в
; sdkconfig.defaults; здесь только то, что нужно самому PlatformIO.

[platformio]
boards_dir = ../boards
src_dir = main          ; ESP-IDF ждёт main/, а не src/

[env:neck]
platform = espressif32
board = iv_neck
framework = espidf

; Без этого PlatformIO считает размер прошивки по своей таблице разделов
; и показывает лимит 1 МБ вместо реальных 8 МБ из partitions.csv.
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
